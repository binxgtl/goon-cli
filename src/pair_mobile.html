<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>goon · Paired Device</title>
<style>
  :root {
    --bg: #0f111a;
    --panel: #181a24;
    --border: #2a2e3f;
    --brand: #a78bfa;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #fb7185;
    --info: #7dd3fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .brand { font-weight: 700; color: var(--brand); font-size: 15px; }
  .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modes {
    display: flex;
    gap: 6px;
    padding: 8px 14px;
    background: #13151f;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .mode-btn {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .mode-btn.active {
    border-color: var(--brand);
    color: var(--brand);
    font-weight: 600;
  }
  .stop-btn {
    margin-left: auto;
    border-color: var(--err);
    color: var(--err);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    line-height: 1.45;
  }
  .entry {
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .entry.user { border-left: 3px solid var(--info); background: #1e2235; }
  .entry.assistant { border-left: 3px solid var(--brand); }
  .entry.tool { font-size: 12px; color: var(--muted); padding: 5px 10px; }
  .entry.system { font-size: 12px; color: var(--muted); border-left: 3px solid var(--border); }
  .entry.approval {
    border: 1px solid var(--warn);
    background: #262015;
  }
  .approval-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-ok { background: var(--ok); color: #052e16; }
  .btn-info { background: var(--info); color: #082f49; }
  .btn-err { background: var(--err); color: #4c0519; }
  form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  textarea#promptInput {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.4;
    min-height: 42px;
    max-height: 160px;
    resize: none;
    overflow-y: hidden;
    outline: none;
  }
  textarea#promptInput:focus { border-color: var(--brand); }
  .send-btn {
    background: var(--brand);
    color: #0f111a;
    border: none;
    border-radius: 8px;
    height: 42px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="brand">◆ goon remote</div>
      <div class="meta" id="meta">Connecting...</div>
    </div>
    <div class="meta" id="statusBadge">●</div>
  </header>
  <div class="modes">
    <button class="mode-btn" data-mode="ask">ask</button>
    <button class="mode-btn" data-mode="plan">plan</button>
    <button class="mode-btn" data-mode="readonly">readonly</button>
    <button class="mode-btn stop-btn" id="stopBtn">Stop</button>
  </div>
  <div id="log"></div>
  <form id="composer">
    <textarea id="promptInput" rows="1" placeholder="Send prompt or /command..." autocomplete="off"></textarea>
    <button class="send-btn" type="submit">Send</button>
  </form>
<script>
  const params = new URLSearchParams(location.search);
  const urlToken = params.get('token') || params.get('t') || '';
  let storedToken = '';
  if (urlToken) {
    try { sessionStorage.setItem('goon_pair_token', urlToken); } catch {}
    params.delete('token');
    params.delete('t');
    const cleanQuery = params.toString();
    const cleanUrl = (location.pathname || '/') + (cleanQuery ? '?' + cleanQuery : '') + (location.hash || '');
    try { history.replaceState(null, '', cleanUrl); } catch {}
  } else {
    try { storedToken = sessionStorage.getItem('goon_pair_token') || ''; } catch {}
  }
  const token = urlToken || storedToken;
  const logEl = document.getElementById('log');
  const metaEl = document.getElementById('meta');
  const statusEl = document.getElementById('statusBadge');
  const promptEl = document.getElementById('promptInput');
  let lastSeq = 0;
  let sseConnected = false;

  function resizePromptInput() {
    if (!promptEl) return;
    promptEl.style.height = 'auto';
    const next = Math.min(promptEl.scrollHeight || 42, 160);
    promptEl.style.height = next + 'px';
    promptEl.style.overflowY = (promptEl.scrollHeight || 0) > 160 ? 'auto' : 'hidden';
  }

  function upsertEntry(entry) {
    if (!entry || !entry.id) return;
    if (typeof entry.seq === 'number' && entry.seq > lastSeq) {
      lastSeq = entry.seq;
    }
    const domId = 'entry-' + entry.id;
    let el = document.getElementById(domId);
    const isNearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 140;
    if (!el) {
      el = document.createElement('div');
      el.id = domId;
      el.className = 'entry ' + (entry.kind || 'system');
      el.textContent = entry.text || '';
      logEl.appendChild(el);
      logEl.scrollTop = logEl.scrollHeight;
    } else if (el.textContent !== entry.text) {
      el.textContent = entry.text || '';
      if (isNearBottom) logEl.scrollTop = logEl.scrollHeight;
    }
  }

  let errSeq = 0;

  function showActionError(err, fallback) {
    errSeq += 1;
    upsertEntry({
      id: 'local-err-' + errSeq,
      kind: 'system',
      text: '✗ ' + ((err && err.message) || fallback),
    });
  }

  function updateHeader(state) {
    if (!state) return;
    const rawCwd = String(state.cwd || '');
    const folder = rawCwd.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || rawCwd;
    const model = String(state.model || '');
    metaEl.textContent = folder ? (model ? model + ' · ' + folder : folder) : model;
    statusEl.textContent = '● ' + (state.status || 'Ready') + ' · ' + (state.mode || 'ask');
    document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === state.mode);
    });
  }

  function renderApprovalBox(msg) {
    if (document.getElementById('approval-' + msg.id)) return;
    const box = document.createElement('div');
    box.className = 'entry approval';
    box.id = 'approval-' + msg.id;
    const title = document.createElement('div');
    title.textContent = '▲ Allow ' + msg.tool + '?\n' + (msg.preview || '');
    const actions = document.createElement('div');
    actions.className = 'approval-actions';
    const choices = [['Allow', 'yes', 'btn-ok']];
    if (msg.canAlways !== false) {
      choices.push([msg.alwaysLabel || 'Always', 'always', 'btn-info']);
    }
    choices.push(['Deny', 'no', 'btn-err']);
    choices.forEach(([label, dec, cls]) => {
      const b = document.createElement('button');
      b.className = 'btn ' + cls;
      b.textContent = label;
      b.onclick = async () => {
        b.disabled = true;
        try {
          await apiPost('/api/approve', { id: msg.id, decision: dec });
          box.textContent = '✓ Decision sent: ' + label;
        } catch (err) {
          b.disabled = false;
          let errEl = box.children[2];
          if (!errEl) {
            errEl = document.createElement('div');
            box.appendChild(errEl);
          }
          errEl.textContent = '✗ ' + ((err && err.message) || 'Approval failed');
        }
      };
      actions.appendChild(b);
    });
    box.appendChild(title);
    box.appendChild(actions);
    logEl.appendChild(box);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function apiPost(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token,
      },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || ('HTTP ' + res.status));
    }
    return data;
  }

  async function pollState(force) {
    if (!force && sseConnected) return;
    try {
      const res = await fetch('/api/state?since=' + encodeURIComponent(lastSeq), {
        headers: { 'Authorization': 'Bearer ' + token },
        cache: 'no-store',
      });
      if (!res.ok) return;
      const data = await res.json();
      if (data.state) updateHeader(data.state);
      if (Array.isArray(data.entries)) {
        data.entries.forEach(upsertEntry);
      }
      if (Array.isArray(data.pendingApprovals)) {
        data.pendingApprovals.forEach(renderApprovalBox);
      }
    } catch {}
  }

  pollState(true);
  setInterval(() => pollState(false), 3000);

  const es = new EventSource('/api/events?t=' + encodeURIComponent(token));
  es.onopen = () => { sseConnected = true; };
  es.onerror = () => { sseConnected = false; };
  es.onmessage = (ev) => {
    sseConnected = true;
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'state') {
        updateHeader(msg.state);
      } else if (msg.type === 'entry' && msg.entry) {
        upsertEntry(msg.entry);
      } else if (msg.type === 'approval') {
        renderApprovalBox(msg);
      } else if (msg.type === 'approval_resolved') {
        const box = document.getElementById('approval-' + msg.id);
        if (box) box.textContent = '✓ Approval resolved (' + msg.decision + ')';
      }
    } catch {}
  };

  document.querySelectorAll('.mode-btn[data-mode]').forEach(btn => {
    btn.onclick = async () => {
      try {
        await apiPost('/api/mode', { mode: btn.dataset.mode });
        pollState(true);
      } catch (err) {
        showActionError(err, 'Mode change failed');
      }
    };
  });
  document.getElementById('stopBtn').onclick = async () => {
    try {
      await apiPost('/api/stop', {});
      pollState(true);
    } catch (err) {
      showActionError(err, 'Stop request failed');
    }
  };

  async function submitPrompt() {
    if (!promptEl) return;
    const rawValue = promptEl.value;
    const text = rawValue.trim();
    if (!text) return;
    promptEl.value = '';
    resizePromptInput();
    try {
      await apiPost('/api/prompt', { prompt: text });
      pollState(true);
    } catch (err) {
      if (!promptEl.value) {
        promptEl.value = rawValue;
        resizePromptInput();
      }
      showActionError(err, 'Send failed');
    }
  }

  if (promptEl) {
    promptEl.addEventListener('input', resizePromptInput);
    promptEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        submitPrompt();
      }
    });
  }

  document.getElementById('composer').onsubmit = async (e) => {
    e.preventDefault();
    await submitPrompt();
  };
</script>
</body>
</html>
